# Le pom est dans ashleyguevarra_phase1_log430/, pas à la racine du repo — Maven + Docker pointent là.
name: CanBankX CI/CD

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    # Les tests utilisent H2 (voir application-test.yml). Pas de vars SPRING_DATASOURCE_* sinon ça casse tout.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ashleyguevarra_phase1_log430/pom.xml

      - name: Build and test with Maven
        working-directory: ./ashleyguevarra_phase1_log430
        run: mvn -B clean verify

  cd:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./ashleyguevarra_phase1_log430
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
