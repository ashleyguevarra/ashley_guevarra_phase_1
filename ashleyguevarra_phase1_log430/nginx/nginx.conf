events {}

http {
    upstream account_backend {
        least_conn;
        server account-service-a:8080;
        server account-service-b:8080;
    }

    upstream transfer_backend {
        least_conn;
        server transfer-service-a:8080;
        server transfer-service-b:8080;
    }

    server {
        listen 80;

        location /actuator/health {
            proxy_pass http://account_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host account-service-a:8080;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /api/v1/customers {
            proxy_pass http://account_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host account-service-a:8080;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /api/v1/accounts {
            proxy_pass http://account_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host account-service-a:8080;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /internal/ {
            proxy_pass http://account_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host account-service-a:8080;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /api/v1/transfers {
            proxy_pass http://transfer_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host transfer-service-a:8080;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
