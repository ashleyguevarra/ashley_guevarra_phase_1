# test = H2 en mémoire, pas de Flyway, pas de Redis (pratique pour CI / laptop sans Docker).
# Si tu mets SPRING_DATASOURCE_URL=postgres dans GitHub Actions sans changer le driver, ça pète le contexte Spring.
spring:
  datasource:
    url: jdbc:h2:mem:testcanbankx;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  cache:
    type: simple
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
