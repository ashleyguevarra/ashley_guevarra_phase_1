global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'canbankx-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'account-service-a:8080'
          - 'account-service-b:8080'
          - 'transfer-service-a:8080'
          - 'transfer-service-b:8080'